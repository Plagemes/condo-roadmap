## Fasi 1–3 (in corso)

**Fase 1 — Stabilizzare e integrare.** Route per ogni modulo e registro moduli unico; caricamento dati per vista; permessi per profilo e collaboratori per condominio; consolidamento dei doppioni (preventivi, economia, assemblee, fornitori) e migrazione delle fatture in contabilità; ciclo preventivo → approvazione → spesa → pagamento; anagrafe condominiale (art. 1130 n.6); notifiche coerenti con link profondi e preferenze; test automatici e CI; segnalazione da telefono con foto; autenticazione a due fattori; storico modifiche; email e PEC con outbox (disattivate di default).

**Fase 2 — Obblighi di legge.** Millesimi come dato unico; rendiconto art. 1130-bis (registro, riepilogo, nota, stato patrimoniale, conguagli, chiusura); riconciliazione bancaria; solleciti di morosità (art. 1129 c.9); registro nomina amministratore (art. 1129–1130); GDPR; protocollo; catalogo adempimenti tecnici e scadenziario unico; scheda fornitore con DURC e polizze; assemblee con quorum art. 1136 e deleghe art. 67; comunicazioni multi-studio; fiscale (ritenute 4%, F24, CU/770, spese detraibili) e import FatturaPA; area del condòmino con estratto conto e attestazione art. 1130 n.9.

> Stato (29/09/2026): il ramo  porta un primo motore dietro il flag  (spento di default): 11.1, 11.2, 11.4, 11.5 (F24 senza compensazioni), 11.6 (parziale), dati per 11.8 e 11.10, 12.4 (import XML/p7m) e i dati per 13.7. Dettagli e limiti in .

> Nota (28/09/2026): oggi la parte fiscale è un tracker di pratiche senza calcolo (). La Fase 2 chiude tracker e import FatturaPA; il motore fiscale (regole versionate, ritenute, F24, CU, 770, detrazioni, quadro AC, IMU) è **scorporato nelle Fasi 10–15**, perché la ricerca normativa lo scompone in più workflow di complessità paragonabile all'intera Fase 2. Vedi .

**Fase 3 — Valore aggiunto.** Notifiche push e presa visione; esportazione per il passaggio di consegne (art. 1129 c.8); ripartizione consumi individuali; compensi dello studio e dipendenti del condominio; sinistri e assicurazioni, lavori straordinari con SAL; ospitalità con notifiche.

## Fasi 10–16 — Fiscale, detrazioni, chiusure, CAF e conformità

Nate dalla ricerca normativa verificata al 28/09/2026 (circa 190 obblighi) e dal confronto con il codice: nessun obbligo fiscale è oggi automatizzato end-to-end. Il dettaglio di ogni obbligo (norma, scadenza, soggetto, certezza, fonte, stato) è in ; i numeri tra parentesi nelle funzioni (es. SI-07) sono gli ID di quella matrice.

Regole comuni a queste fasi:

- **Nessun calcolo fiscale nel codice**: aliquote, soglie, codici tributo, causali, sanzioni, scadenze e riferimenti normativi si leggono dalle tabelle versionate della Fase 10. Ogni calcolo registra la versione delle regole usata.
- **CONDO prepara, l'intermediario trasmette**: file nei tracciati ministeriali dell'anno, invio da parte dell'amministratore con la propria utenza o dell'intermediario abilitato; nessuna credenziale AdE salvata.
- **Punti incerti configurabili** con default prudente e parere del consulente allegato (elenco al paragrafo 5 di ). Prima dell'attivazione in produzione ogni fase richiede la validazione di un commercialista (Fasi 10–15) o di un consulente del lavoro/avvocato (11.12–11.16, Fase 16).
- Dove una voce estende una funzione delle Fasi 1–9 è scritto "estende X": il lavoro si fa sul modulo esistente, non se ne crea un doppione.
